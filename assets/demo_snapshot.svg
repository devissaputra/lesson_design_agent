<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Lesson Design Agent synthetic demo snapshot</title>
<desc id="desc">Synthetic lesson design example showing matched cognitive demand, phase timing, accessibility context and review flag.</desc>
<rect width="1200" height="330" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic contextual lesson-design demo</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">90-minute hybrid lesson · early-career operations analysts · deterministic scaffold, not an empirical result.</text>

<rect x="52" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Highest matched level</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">Evaluate</text>

<rect x="330" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="348" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Phase minutes</text>
<text x="348" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">10 · 23 · 35 · 22</text>

<rect x="608" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="626" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Assessment evidence</text>
<text x="626" y="172" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">criteria + evidence + judgment</text>

<rect x="886" y="112" width="262" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="904" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Review flag</text>
<text x="904" y="172" font-family="Arial" font-size="14" font-weight="600" fill="#f3f4f6">multiple cognitive levels</text>

<text x="52" y="258" font-family="Arial" font-size="14" fill="#d1d5db">Matched evidence includes analyze + justify; the higher supported demand selects the provisional sequence.</text>
<text x="52" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
</svg>