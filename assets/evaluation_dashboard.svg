<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Lesson Design Agent evaluation checklist</title>
<desc id="desc">Illustrative evidence categories for validating objective interpretation, sequence fit, assessment alignment and designer editing effort.</desc>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Lesson Design Agent · evaluation checklist</text>
<text x="60" y="99" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">Bars are illustrative only. A real study should report expert ratings, disagreement, uncertainty, and revision effort.</text>
<rect x="52" y="126" width="1096" height="300" rx="18" fill="#F3F5F3" stroke="#CDD3CF"/>

<text x="70" y="189" font-family="Arial" font-size="17" fill="#26343B">objective interpretation</text>
<rect x="350" y="170" width="560" height="25" rx="8" fill="#E8EBE8"/><rect x="350" y="170" width="420" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="189" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="259" font-family="Arial" font-size="17" fill="#26343B">sequence / activity fit</text>
<rect x="350" y="240" width="560" height="25" rx="8" fill="#E8EBE8"/><rect x="350" y="240" width="370" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="259" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="329" font-family="Arial" font-size="17" fill="#26343B">assessment alignment</text>
<rect x="350" y="310" width="560" height="25" rx="8" fill="#E8EBE8"/><rect x="350" y="310" width="345" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="329" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="399" font-family="Arial" font-size="17" fill="#26343B">designer editing effort</text>
<rect x="350" y="380" width="560" height="25" rx="8" fill="#E8EBE8"/><rect x="350" y="380" width="395" height="25" rx="8" fill="#5A7F82"/>
<text x="940" y="399" font-family="Arial" font-size="15" fill="#5B6660">illustrative</text>

<text x="70" y="455" font-family="Arial" font-size="15" fill="#5B6660">The goal is to test whether transparent constraints reduce design omissions without creating false pedagogical confidence.</text>
</svg>