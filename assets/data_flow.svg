<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Lesson Design Agent data and reasoning flow</title>
<desc id="desc">Topic, objective, duration, audience and delivery context feed objective evidence, adaptive lesson sequencing, assessment evidence, accessibility prompts and review flags.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52656D"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Lesson Design Agent · data and reasoning flow</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">Objective evidence is preserved so the designer can inspect or reject the provisional cognitive classification.</text>

<rect x="60" y="145" width="230" height="110" rx="18" fill="#E8F1F3" stroke="#87949A" stroke-width="2"/>
<text x="175" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">01</text>
<text x="175" y="207" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Topic + objective +</text>
<text x="175" y="230" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">design context</text>

<line x1="295" y1="200" x2="350" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="365" y="145" width="230" height="110" rx="18" fill="#EEF3E8" stroke="#87949A" stroke-width="2"/>
<text x="480" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">02</text>
<text x="480" y="207" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Verb evidence +</text>
<text x="480" y="230" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">cognitive demand</text>

<line x1="600" y1="200" x2="655" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="670" y="145" width="230" height="110" rx="18" fill="#F5EDE4" stroke="#87949A" stroke-width="2"/>
<text x="785" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">03</text>
<text x="785" y="207" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">Adaptive phases +</text>
<text x="785" y="230" text-anchor="middle" font-family="Arial" font-size="16" fill="#26343B">exact minute budget</text>

<line x1="905" y1="200" x2="945" y2="200" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="960" y="145" width="190" height="110" rx="18" fill="#ECE8F5" stroke="#87949A" stroke-width="2"/>
<text x="1055" y="180" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#1B2430">04</text>
<text x="1055" y="202" text-anchor="middle" font-family="Arial" font-size="15" fill="#26343B">Assessment evidence</text>
<text x="1055" y="223" text-anchor="middle" font-family="Arial" font-size="15" fill="#26343B">access prompts + flags</text>

<text x="60" y="320" font-family="Arial" font-size="15" fill="#5B6660">Unknown objectives remain unknown; missing context becomes a visible review flag rather than a hidden default.</text>
<text x="60" y="346" font-family="Arial" font-size="15" fill="#5B6660">The baseline proposes structure and rationale, not subject-matter truth or a finished lesson.</text>
</svg>